name: Robot Framework Testit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi repositoriosta
        uses: actions/checkout@v4

      - name: Asenna Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Asenna Robot Framework ja Browser Library
        run: |
          pip install robotframework robotframework-browser
          rfbrowser init chromium

      - name: Aja testit headless-tilassa
        run: robot --rpa --variable HEADLESS:True .

      - name: Tallenna testiraportit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-raportit
          path: |
            log.html
            report.html