name: Robot Framework Testit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  testit:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Asenna kirjastot ja selaimen riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-browser robotframework-requests
          npx playwright install-deps chromium
          rfbrowser init chromium

      - name: Aja Robot Framework -testit ja RPA-robotit
        run: xvfb-run --auto-servernum robot --rpa .

      - name: Tallenna testiraportit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-raportit
          path: |
            report.html
            log.html
            output.xml